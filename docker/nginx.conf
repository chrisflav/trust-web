server {
  # 8080, not 80: the image runs as an unprivileged user, and a port below
  # 1024 is one it cannot bind.  The proxy in front publishes 443.
  listen 8080;
  root /usr/share/nginx/html;

  # decls.jsonl is tens of megabytes of text and compresses hard.  The edge
  # files are already binary, and gzipping them would only cost CPU.
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1024;

  # The index is bind-mounted rather than baked in: it is generated by
  # `trust export`, changes independently of the code, and is far too large to
  # live in an image.  A missing shard must 404 rather than fall through to the
  # SPA, or the frontend would try to parse index.html as an edge file.
  # `.jsonl` is not a type nginx knows, so it defaults to octet-stream and is
  # never compressed — which for a 76 MB declaration table is most of the load
  # time.  Named explicitly rather than adding octet-stream to `gzip_types`,
  # which would waste CPU re-compressing the already-binary edge files.
  location ~ ^/index/.*\.jsonl$ {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }

  location /index/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }


  # ------------------------------------------------------------------ /release/ --
  # Indexes published as release assets, read through this origin.
  #
  # `trust-action`'s `publish: release` uploads an index one file per asset.
  # Assets have no directory structure, so the layout is folded into the name —
  # `mylib/code/7.jsonl` becomes `mylib--code--7.jsonl` — and these two locations
  # fold it back, so that the frontend fetches the same paths it fetches from a
  # branch or from `/index/` and does not know the difference.
  #
  # Two locations rather than one because nginx has no string replacement: the
  # index has exactly two shapes below its own directory, a file and a code
  # shard, and matching them is cheaper than generalising.  The shard pattern is
  # first: nginx takes the first regex location that matches.
  #
  # This will fetch any public release asset from any public repository, which is
  # what makes the picker work for a repository this deployment has never heard
  # of, and also means a deployment is a download mirror for GitHub releases to
  # anyone who points at it.  That is the trade; a deployment that does not want
  # it should drop these three blocks, and `?gh=` branches keep working.
  location ~ "^/release/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)/code/([A-Za-z0-9._-]+)$" {
    set $gh_owner $1;
    set $gh_repo  $2;
    set $gh_tag   $3;
    set $asset    "$4--code--$5";
    include /etc/nginx/release-proxy.inc;
    include /etc/nginx/release-proxy-tail.inc;
  }

  location ~ "^/release/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)$" {
    set $gh_owner $1;
    set $gh_repo  $2;
    set $gh_tag   $3;
    set $asset    "$4--$5";
    include /etc/nginx/release-proxy.inc;
    include /etc/nginx/release-proxy-tail.inc;
  }

  # The signed URL the 302 points at.  A second hop rather than a redirect the
  # browser follows, because that host is the one without the CORS header.
  location @release_redirect {
    internal;
    set $release_target $upstream_http_location;
    proxy_pass $release_target;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    include /etc/nginx/release-proxy-tail.inc;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
