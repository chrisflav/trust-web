# The frontend and a node, on one origin.
#
#   cd docker && cp .env.example .env && $EDITOR .env && docker compose up --build
#
# Both bind to loopback: a reverse proxy in front of them is what the outside
# world reaches, and it is what holds the TLS.  See `deploy/` for the vhost.
#
# There is no database service.  The node keeps a SQLite file on a named volume.

services:
  node:
    # Built straight from its own repository — no second clone to keep in step.
    # The build stage fetches the Lean toolchain and compiles the node, which
    # takes a few minutes the first time and is then cached.  Pin the fragment
    # (`#v4.32.0`) if you would rather not track `master`.
    build:
      context: https://github.com/chrisflav/trust-server.git
      dockerfile: docker/Dockerfile
    environment:
      NODE_NAME: ${NODE_NAME:-trust}
      # The node's own externally reachable URL.  §5.2 checks an announcement
      # against it and §7.1 puts it in the relay chain, so it has to be what
      # other people actually reach you by — not the container's port.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Empty by default: a node that federates with strangers, or lets them
      # tell it to, should be something an operator asked for.
      FEDERATION_SEEDS: ${FEDERATION_SEEDS:-}
      FEDERATION_AUTODISCOVER: ${FEDERATION_AUTODISCOVER:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - store:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SERVER_PORT:-8099}:8080"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the bundle at build time, so changing it needs --build.
        # It is the *origin*, not the container: the browser asks for
        # `${PUBLIC_URL}/api/...`, the proxy routes that to the node, and the
        # session cookie stays first-party because it never left the origin.
        VITE_TRUST_SERVER: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    volumes:
      # Exported indexes, read-only.  Generated by `trust export`, hundreds of
      # megabytes, and nothing an image should ever contain.  Replacing a
      # directory under here publishes a new index without rebuilding anything.
      - ${INDEX_DIR:-../public/index}:/usr/share/nginx/html/index:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-5174}:8080"
    depends_on:
      - node
    restart: unless-stopped

volumes:
  store:
