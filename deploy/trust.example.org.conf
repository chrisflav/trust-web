# The frontend and the node, on one origin.
#
# That is the whole point of this file.  The browser holds a first-party session
# cookie and makes same-origin requests, so there is no CORS at all and nothing
# depends on a cross-site cookie — which browsers increasingly refuse to send
# however correctly it is labelled.
#
#   /        the frontend, static files from the `web` container
#   /index/  exported indexes, served by the same nginx from a bind mount
#   /api/    the node
#   /auth/   the node's GitHub sign-in
#
# Install:
#   a2enmod proxy proxy_http ssl headers rewrite
#   cp trust.example.org.conf /etc/apache2/sites-available/
#   a2ensite trust.example.org && apachectl configtest && systemctl reload apache2
#   certbot --apache -d trust.example.org
#
# Replace trust.example.org throughout, and check that the ports match
# `BIND_ADDR`/`WEB_PORT`/`SERVER_PORT` in `docker/.env`.

<VirtualHost *:80>
  ServerName trust.example.org
  # certbot rewrites this block when it runs; until then it is what redirects
  # plain HTTP, and after certbot it stays correct.
  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName trust.example.org

  SSLEngine on
  # certbot fills these in.
  # SSLCertificateFile    /etc/letsencrypt/live/trust.example.org/fullchain.pem
  # SSLCertificateKeyFile /etc/letsencrypt/live/trust.example.org/privkey.pem

  # The containers listen on loopback only (see BIND_ADDR).  Everything reaches
  # them through here, so the TLS, the redirects and the headers below cannot be
  # walked past.
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"

  # The node.  Two prefixes, not one: `/auth/` is the OAuth round trip and
  # `/api/` is everything else, and the frontend is served from the same origin
  # so that the session cookie it sets is first-party.
  ProxyPass        /api/  http://127.0.0.1:8099/api/
  ProxyPassReverse /api/  http://127.0.0.1:8099/api/
  ProxyPass        /auth/ http://127.0.0.1:8099/auth/
  ProxyPassReverse /auth/ http://127.0.0.1:8099/auth/

  # A federated pull can wait on a peer for as long as §8's query budget allows,
  # and the default proxy timeout is shorter than that.
  ProxyTimeout 30

  # Everything else is the frontend, including `/index/`, which nginx serves
  # from the bind-mounted export directory.
  ProxyPass        / http://127.0.0.1:5174/
  ProxyPassReverse / http://127.0.0.1:5174/

  # An exported index is generated data, and the frontend is a static bundle;
  # neither should be framed or sniffed.
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  # HSTS only once TLS is actually in place — uncomment after certbot.
  # Header always set Strict-Transport-Security "max-age=31536000"

  ErrorLog  ${APACHE_LOG_DIR}/trust-error.log
  CustomLog ${APACHE_LOG_DIR}/trust-access.log combined
</VirtualHost>
